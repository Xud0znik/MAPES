<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="ATLAS AUDIT">
  <defs>
    <!-- red gradient for the wordmark -->
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6076"/>
      <stop offset="45%" stop-color="#ef1f3f"/>
      <stop offset="100%" stop-color="#a70022"/>
    </linearGradient>
    <!-- subtle dark panel background with a faint red vignette -->
    <radialGradient id="panel" cx="50%" cy="32%" r="85%">
      <stop offset="0" stop-color="#1a0c12"/>
      <stop offset="60%" stop-color="#0d0c11"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <!-- gentle halo: a low-opacity blur sits UNDER the crisp text -->
    <filter id="glow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
      <feFlood flood-color="#ff2645" flood-opacity="0.55" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="2" y="2" width="896" height="226" rx="18" fill="url(#panel)"/>
  <rect x="2.75" y="2.75" width="894.5" height="224.5" rx="17.25" fill="none" stroke="#ef1f3f" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- hacker prompt line -->
  <text x="40" y="52" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace"
        font-size="19" fill="#ff8aa0" fill-opacity="0.8" letter-spacing="1">root@atlas</text>
  <text x="163" y="52" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace"
        font-size="19" fill="#7f8a97" letter-spacing="1">:~/engagement#</text>

  <!-- wordmark: crisp, with a gentle halo -->
  <text x="450" y="150" text-anchor="middle" filter="url(#glow)"
        font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="92" letter-spacing="7" fill="url(#neon)">ATLAS AUDIT</text>

  <!-- tagline -->
  <text x="450" y="196" text-anchor="middle"
        font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace"
        font-size="16" fill="#c9d1d9" fill-opacity="0.6" letter-spacing="6">RED&#160;TEAM&#160;&#160;//&#160;&#160;PENTEST&#160;&#160;//&#160;&#160;AUDIT&#160;WORKSPACE</text>
</svg>
