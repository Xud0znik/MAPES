<div id="app">
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/static/atlasIcon.png" alt="ATLAS"><span>ATLAS</span></div>
    <span class="brand-sep"></span>
    <!-- Custom dropdown, not a <select>: the native popup is drawn by the OS and
         ignores the theme, so it always rendered as a white list on dark chrome. -->
    <div class="proj-switch" id="proj-switch">
      <button class="proj-btn" id="project-btn" type="button" title="Switch project"
              aria-haspopup="listbox" aria-expanded="false">
        <svg class="ic proj-ic"><use href="#i-folder"/></svg>
        <span class="proj-name" id="project-name"></span>
        <svg class="ic proj-cv"><use href="#i-chevron-down"/></svg>
      </button>
    </div>
    <nav class="topnav">
      <button class="navb on" data-v="over"><svg class="ic"><use href="#i-dash"/></svg>Overview</button>
      <button class="navb" data-v="nodes"><svg class="ic"><use href="#i-layers"/></svg>Nodes</button>
      <button class="navb" data-v="board"><svg class="ic"><use href="#i-board"/></svg>Board</button>
      <button class="navb" data-v="vault"><svg class="ic"><use href="#i-vault"/></svg>Vault</button>
      <button class="navb" data-v="loot"><svg class="ic"><use href="#i-key"/></svg>Credentials</button>
      <button class="navb" data-v="findings"><svg class="ic"><use href="#i-flag"/></svg>Findings</button>
      <button class="navb" data-v="docs"><svg class="ic"><use href="#i-note"/></svg>Reports</button>
      <button class="navb" data-v="settings"><svg class="ic"><use href="#i-gear"/></svg>Settings</button>
    </nav>
    <div class="top-actions">
      <button class="ic-btn" id="btn-theme" title="Switch theme"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button class="ic-btn" id="btn-wic" title="While it cracks" hidden><svg class="ic"><use href="#i-play"/></svg></button>
      <button class="ic-btn" id="btn-help" title="Keyboard shortcuts"><svg class="ic"><use href="#i-help"/></svg></button>
      <button class="ic-btn" id="new-project" title="New project"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
  </header>

  <main class="main">
    <section class="view on" id="v-over"></section>
    <section class="view" id="v-nodes"></section>
    <section class="view" id="v-board"></section>
    <section class="view" id="v-vault"></section>
    <section class="view" id="v-loot"></section>
    <section class="view" id="v-findings"></section>
    <section class="view" id="v-docs"></section>
    <section class="view" id="v-settings"></section>
  </main>

  <footer class="statusbar" id="statusbar" hidden></footer>
</div>

<div class="modal-wrap" id="modal-wrap" hidden>
  <div class="modal" id="modal"></div>
</div>

<!-- Login gate. Hidden by default and shown only when /api/session says a
     password is configured and this browser has no valid session. -->
<div class="login-wrap" id="login-wrap" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <img class="login-logo" src="/static/atlasIcon.png" alt="">
    <h1 class="login-t">ATLAS</h1>
    <p class="login-s">Sign in to open the audit board</p>
    <label class="login-f">
      <span>Username</span>
      <input id="login-user" name="username" autocomplete="username" autofocus required>
    </label>
    <label class="login-f">
      <span>Password</span>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="login-err" id="login-err" hidden></div>
    <button class="btn pri login-go" id="login-go" type="submit">Sign in</button>
    <div class="login-note" id="login-note"></div>
  </form>
</div>

<div id="toast"></div>

<script src="/static/cvss.js"></script>
<script src="/static/hashid.js"></script>
<script src="/static/game.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
